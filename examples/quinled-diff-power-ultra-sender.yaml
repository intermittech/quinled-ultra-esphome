# QuinLED Diff-Power sender with QuinLED Diff-Power Ultra receivers: two ports, each with an Ultra line and its
# telemetry, its power switched by the port (standby while nothing on it is lit). Named the way Home Assistant finds
# things across several controllers (wiki: Telemetry dashboards, "Names in Home Assistant"):
#   - the controller: a short name, unique in the house (friendly_name: Sender 1); its totals are on it
#   - each port: a device "Sender 1 · Port 1" (its telemetry and its Diff-Power port, without a name prefix)
#   - a receiver with one light: a device named after the light, in its room; the light takes the device's name
#   - a receiver with several lights: a device "Sender 1 · Port 2 · Receiver 1"; each light a device of its own in its
#     room. No room inside device names: Home Assistant puts the area in front of the entity ids
# ESP32 classic, ESP-IDF. Set the pins to your sender's wiring.

substitutions:
  name: sender-1
  friendly_name: Sender 1
  port1_data: GPIO16      # port 1's Ultra data line
  port1_enable: GPIO25    # its ChannelEnable (the sender switches the 55 V: this AND its own board detection)
  port1_detect: GPIO35    # its Detect output (3.3 V; Sender-1 revisions that have it): a placeholder pin
  port1_rx: GPIO34        # its RS-485 receiver output (the answers)
  port1_de: GPIO4         # its RS-485 driver enable (DE)
  port2_data: GPIO17
  port2_enable: GPIO26
  port2_detect: GPIO36
  port2_rx: GPIO39
  port2_de: GPIO5

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: quinled.diff-power-sender
    version: "0.1.0"
  areas:
    - id: living_room
      name: Living room
    - id: study
      name: Study
  devices:
    - id: port_1
      name: ${friendly_name} · Port 1
    - id: port_2
      name: ${friendly_name} · Port 2
    - id: living_cove
      name: Living cove
      area_id: living_room
    - id: port_2_receiver_1
      name: ${friendly_name} · Port 2 · Receiver 1
    - id: bookshelf_1
      name: Bookshelf 1
      area_id: study
    - id: bookshelf_2
      name: Bookshelf 2
      area_id: study

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source: github://intermittech/quinled-ultra-esphome@main
    components: [dig2analog_ultra, diffpower]
    # Developing the component itself? Use the local copy instead:
    # source:
    #   type: local
    #   path: ../components

logger:
api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}
captive_portal:

# The time now, for the ports' "During dark" power mode (its sunrise / sunset come from Home Assistant's sun.sun: no
# coordinates needed; without Home Assistant, or as its backup, add ESPHome's sun and a sun_id per port: wiki,
# Power modes)
time:
  - platform: homeassistant
    id: ha_time

uart:
  - id: rs485_1
    rx_pin: ${port1_rx}
    baud_rate: 1000000
    rx_buffer_size: 1024
  - id: rs485_2
    rx_pin: ${port2_rx}
    baud_rate: 1000000
    rx_buffer_size: 1024

# The ports' power: on while a light on them is lit (and its turn-off period), standby otherwise; each with a Wake
# button (motion automations press it) and a Power mode select (Standby, During dark, Always on)
diffpower:
  - id: port1
    name: Port 1
    device_id: port_1
    enable_pin: ${port1_enable}
    detect_pin: ${port1_detect}     # Sender-1 revision with the Detect output; leave it out for the first revision
  - id: port2
    name: Port 2
    device_id: port_2
    enable_pin: ${port2_enable}
    detect_pin: ${port2_detect}     # (as port 1)

dig2analog_ultra:
  - id: line1
    pin: ${port1_data}
    num_boards: 1
    rmt_symbols: 128
    port: port1
    telemetry:
      uart_id: rs485_1
      name: Port 1
      device_id: port_1
      direction_pin: ${port1_de}
      receivers:
        - device_id: living_cove
  - id: line2
    pin: ${port2_data}
    num_boards: 1
    rmt_symbols: 128
    port: port2
    telemetry:
      uart_id: rs485_2
      name: Port 2
      device_id: port_2
      direction_pin: ${port2_de}
      receivers:
        - device_id: port_2_receiver_1

light:
  # a receiver with one light: the light is its device's main entity (no name of its own)
  - platform: dig2analog_ultra
    dig2analog_ultra_id: line1
    name: None
    device_id: living_cove
    board: 0
    red: 1
    green: 2
    blue: 3
    cold_white: 4
    warm_white: 5
  # a receiver with two lights: each its own device in its room (its estimated power and energy, its Port)
  - platform: dig2analog_ultra
    dig2analog_ultra_id: line2
    name: None
    device_id: bookshelf_1
    board: 0
    cold_white: 1
    warm_white: 2
  - platform: dig2analog_ultra
    dig2analog_ultra_id: line2
    name: None
    device_id: bookshelf_2
    board: 0
    cold_white: 3
    warm_white: 4
