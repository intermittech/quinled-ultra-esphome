# QuinLED Dig2Analog-Plus-5ch: update the boards' firmware over the data line, from the ESP32's web page or Home
# Assistant. Four boards, one RGB light each. The boards have no return channel, so the update entity can't ask them
# what they are: `inventory:` names each board's bootloader (`boot_identity:`), and nothing is copied next to the YAML.
# The Install button below starts the update from ESPHome's web page (its update card showed no Install button of its
# own on the first bench run); in Home Assistant the update entity's own Install works too.
# ESP32 classic, ESP-IDF. Boards in Ultra mode.

substitutions:
  name: d2a-plus-update
  friendly_name: Dig2Analog-Plus-5ch update
  data_pin: GPIO16   # controller output wired to the first board's Data-In

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:                      # Home Assistant: manufacturer quinled, the board as model
    name: quinled.dig2analog-plus-5ch
    version: "0.1.0"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  # @main until the first release; then pin one (@v0.x.y, wiki: Installation)
  - source: github://intermittech/quinled-ultra-esphome@main
    components: [ultra_line, dig2analog_plus]
    # Developing the component itself? Use the local copy instead:
    # source:
    #   type: local
    #   path: ../components

logger:
api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s   # lights keep running without Home Assistant (the default reboots after 15 min)
ota:
  - platform: esphome
    encryption:                # uploads use the api encryption key
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:                 # the fallback hotspot (captive portal) if the Wi-Fi is gone
    password: !secret fallback_ap_password
captive_portal:

web_server:           # the ESP32's own page: http://<its address>/
  port: 80
  version: 3

http_request:         # the update entity downloads the release over https
  buffer_size_rx: 2048   # GitHub's answer has about 0.9 KB of headers; the default 512 can't hold them
  timeout: 30s

ultra_line:
  id: ultra
  pin: ${data_pin}
  num_boards: 4

update:
  - platform: ultra_line
    id: board_fw
    ultra_line_id: ultra
    name: Board firmware
    channel: stable               # stable (default), beta or alpha
    status:
      name: Board firmware status
    report:
      name: Board firmware report
    inventory:                    # the boards (1 = the first on the line) and the bootloader each one runs
      - board: 1
        boot_identity: dig2analog_plus_5ch_rev04_bl4
      - board: 2
        boot_identity: dig2analog_plus_5ch_rev04_bl4
      - board: 3
        boot_identity: dig2analog_plus_5ch_rev04_bl4
      - board: 4
        boot_identity: dig2analog_plus_5ch_rev04_bl4

button:
  - platform: template
    name: Install board firmware
    entity_category: config
    icon: mdi:cellphone-arrow-down
    on_press:
      - update.perform: board_fw   # the same as the update entity's Install: one job for the whole line

light:
  - platform: dig2analog_plus
    name: Post 1
    board: 1
    red: 1
    green: 2
    blue: 3
  - platform: dig2analog_plus
    name: Post 2
    board: 2
    red: 1
    green: 2
    blue: 3
  - platform: dig2analog_plus
    name: Post 3
    board: 3
    red: 1
    green: 2
    blue: 3
  - platform: dig2analog_plus
    name: Post 4
    board: 4
    red: 1
    green: 2
    blue: 3
