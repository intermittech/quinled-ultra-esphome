# Dig2Analog-Plus-5ch candle niches: effects run on ESPHome; the board interpolates their SET targets in 16 bits.
# Before ESPHome takes over, each board shows its stored power-on level.
# CH1 and CH2 are single-colour niches; CH4 warm white and CH5 cold white form a CCT strip.
# On released wire 2, signal_loss: scene uses the power-on level; signal_loss_level is retained on the host.

substitutions:
  name: d2a-plus-candles
  friendly_name: Dig2Analog-Plus-5ch candles

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:                      # Home Assistant: manufacturer quinled, the board as model
    name: quinled.dig2analog-plus-5ch
    version: "0.1.0"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  # @main until the first release; then pin one (@v0.x.y, wiki: Installation)
  - source: github://intermittech/quinled-ultra-esphome@main
    components: [ultra_line, dig2analog_plus]

logger:
api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s   # lights keep running without Home Assistant (the default reboots after 15 min)
ota:
  - platform: esphome
    encryption:                # uploads use the api encryption key
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:                 # the fallback hotspot (captive portal) if the Wi-Fi is gone
    password: !secret fallback_ap_password
captive_portal:

ultra_line:
  id: ultra
  pin: GPIO16
  num_boards: 1
  signal_loss: scene

light:
  - platform: dig2analog_plus
    name: Niche left
    board: 1
    channel: 1
    restore_mode: RESTORE_DEFAULT_ON   # ESPHome restores the last state, effect included
    effects:
      - ultra_candle:
    power_on_level: 100%
    signal_loss_level: 20%

  - platform: dig2analog_plus
    name: Niche right
    board: 1
    channel: 2
    restore_mode: RESTORE_DEFAULT_ON
    effects:
      - ultra_candle:
          intensity: 30%
          speed: 70%
    power_on_level:
      brightness: 60%

  - platform: dig2analog_plus
    name: Niche strip
    board: 1
    warm_white: 4
    cold_white: 5
    cold_white_color_temperature: 6500 K
    warm_white_color_temperature: 2700 K
    constant_brightness: true
    restore_mode: RESTORE_DEFAULT_ON
    effects:
      - ultra_candle:
      - ultra_breathe:
    power_on_level:
      brightness: 70%
      color_temperature: 2700 K
