# QuinLED Dig2Analog-Plus-5ch in Ultra mode: four boards, one RGB light each (e.g. four garden posts), and
# one virtual strip over them, so ESPHome's addressable effects (rainbow, color wipe, scan, twinkle, ...) run
# across the posts. Each post is one pixel; its board applies gamma and glides between the effect's steps.
# ESP32 classic, ESP-IDF. Boards in Ultra mode: protocol 3 (or auto: they recognise Ultra frames).

substitutions:
  name: d2a-plus-strip
  friendly_name: Dig2Analog-Plus-5ch strip
  data_pin: GPIO16   # controller output wired to the first board's Data-In

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:                      # Home Assistant: manufacturer quinled, the board as model
    name: quinled.dig2analog-plus-5ch
    version: "0.1.0"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  # @main until the first release; then pin one (@v0.x.y, wiki: Installation)
  - source: github://intermittech/quinled-ultra-esphome@main
    components: [ultra_line, dig2analog_plus, ultra_analog_strip]
    # Developing the component itself? Use the local copy instead:
    # source:
    #   type: local
    #   path: ../components

logger:
api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s   # lights keep running without Home Assistant (the default reboots after 15 min)
ota:
  - platform: esphome
    encryption:                # uploads use the api encryption key
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:                 # the fallback hotspot (captive portal) if the Wi-Fi is gone
    password: !secret fallback_ap_password
captive_portal:

ultra_line:
  id: ultra
  pin: ${data_pin}
  num_boards: 4

light:
  # The posts: one RGB light per board. They stay separate lights too; a post that is on by itself shows its
  # own state, the strip drives the posts that are off. Leave out internal: true to see them in Home Assistant.
  - platform: dig2analog_plus
    id: post_1
    name: Post 1
    internal: true
    board: 1
    red: 1
    green: 2
    blue: 3
  - platform: dig2analog_plus
    id: post_2
    name: Post 2
    internal: true
    board: 2
    red: 1
    green: 2
    blue: 3
  - platform: dig2analog_plus
    id: post_3
    name: Post 3
    internal: true
    board: 3
    red: 1
    green: 2
    blue: 3
  - platform: dig2analog_plus
    id: post_4
    name: Post 4
    internal: true
    board: 4
    red: 1
    green: 2
    blue: 3

  # The strip: pixel 0 = post_1, pixel 1 = post_2, ... (any order, any boards and data lines)
  - platform: ultra_analog_strip
    name: Garden posts
    lights: [post_1, post_2, post_3, post_4]
    effects:
      - addressable_rainbow:
          name: Rainbow
          width: 4          # one full rainbow over the four posts
      - addressable_color_wipe:
      - addressable_scan:
          move_interval: 300ms
      - addressable_twinkle:
      - addressable_fireworks:
      - addressable_flicker:
