# QuinLED Diff-Power sender with a Diff-Power Ultra Receiver Digital-Medium on port 1: a pixel strip whose effects the
# receiver makes itself (local pixel effects: Aurora, Rainbow, Candle, ... no pixel stream, no Wi-Fi load per pixel).
# The light has the protocol's effect list, and Speed, Intensity, Palette, Colour 2 / 3 and Custom 1 / 2 entities.
# The ur_digital_m.effect_params action also sets these parameters. The same strip has an addressable light (ur_digital_m_stream:
# its pixels go through the receiver, between the line's marker frames); the two are exclusive (exclusive_with, wiki:
# Diff-Power-UR-Digital-M effects): the stream stops while a local effect runs and starts again when it is switched off.
# The line is a DIGITAL PORT (digital:): the receiver sits in the strip's data path, its frames go behind markers in latch
# gaps the strip never sees, one receiver per port. ESP32 classic, ESP-IDF. Set the pins to your sender's wiring.

substitutions:
  name: sender-1
  friendly_name: Sender 1
  port1_data: GPIO16      # port 1's data line (pixel frames, markers and Ultra frames to the receiver)
  port1_enable: GPIO25    # its ChannelEnable
  port1_rx: GPIO34        # its RS-485 receiver output (the receiver's answers: page 0x81 and the telemetry)
  port1_de: GPIO4         # its RS-485 driver enable (DE)

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: quinled.diff-power-ur-digital-m
    version: "0.1.0"
  areas:
    - id: garden
      name: Garden
  devices:
    - id: port_1
      name: ${friendly_name} · Port 1
    - id: garden_strip
      name: Garden strip
      area_id: garden

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  # @main until the first release; then pin one (@v0.x.y, wiki: Installation)
  - source: github://intermittech/quinled-ultra-esphome@main
    components: [ultra_line, diffpower, ur_digital_m, ur_digital_m_stream]
    # Developing the component itself? Use the local copy instead:
    # source:
    #   type: local
    #   path: ../components

logger:
api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s   # the strip keeps running without Home Assistant (the default reboots after 15 min)
ota:
  - platform: esphome
    encryption:                # uploads use the api encryption key
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:                 # the fallback hotspot (captive portal) if the Wi-Fi is gone
    password: !secret fallback_ap_password
captive_portal:

uart:
  - id: rs485_1
    rx_pin: ${port1_rx}
    baud_rate: 1000000
    rx_buffer_size: 1024

diffpower:
  - id: port1
    name: Port 1
    device_id: port_1
    enable_pin: ${port1_enable}

ultra_line:
  - id: line1
    pin: ${port1_data}
    num_boards: 1          # one Diff-Power-UR-Digital-M per port
    rmt_symbols: 128
    digital:               # the receiver is in the strip's data path (markers, latch gaps, polls that leave the line)
      reset_time: 300us    # the strip chip's latch (WS2812B 280 us and more; SK6812 80 us)
    port: port1
    telemetry:
      uart_id: rs485_1
      name: Port 1
      device_id: port_1
      direction_pin: ${port1_de}
      receivers:
        - device_id: garden_strip

light:
  # the local pixel light: the receiver on board 1 of the line, a 300 pixel WS2812B strip
  - platform: ur_digital_m
    ultra_line_id: line1
    name: None
    device_id: garden_strip
    board: 1
    board_type: v203              # v407 for CH32V407: that board's native HA effect catalogue and pixel limits
    chip: ws2812b
    num_leds: 300
    color_order: GRB
    default_transition_length: 1s
    exclusive_with: garden_stream   # (the stream light below: one of the two shows the strip)
    # what the receiver does without the controller: show the light's last effect again after a power cut
    store_after: 30s
    standalone:
      power_on: true
  # the same strip as an ESPHome addressable light: its pixels go through the receiver (no RMT channel of its own)
  - platform: ur_digital_m_stream
    id: garden_stream
    name: Garden strip (stream)
    device_id: garden_strip
    ultra_line_id: line1
    num_leds: 300
    chipset: ws2812
    channel_colors: GRB
    default_transition_length: 1s
    effects:
      - addressable_rainbow:
      - pulse:

button:
  # after the receiver stopped answering (the hub polled it 3 times, 60 s later 3 more, and keeps the strip free of markers
  # since: the Garden strip's receiver is not there, or its cable): poll it again
  - platform: template
    name: Retry receiver
    entity_category: config
    on_press:
      - ultra_line.retry_receiver:
          id: line1
