# QuinLED Diff-Power sender with a QuinLED Diff-Power Ultra-Digital receiver on port 1: a pixel strip whose effects the
# receiver makes itself (local pixel effects: Aurora, Rainbow, Candle, ... no pixel stream, no Wi-Fi load per pixel).
# The light has the protocol's effect list, and Speed, Intensity and Palette as entities of its device; colour 2 and 3
# through the ultra_digital.effect_params action. Port 2 streams pixels (an ESPHome addressable light on the same kind of
# strip) and is exclusive with a local light only where both share a strip (see exclusive_with, wiki: Ultra-Digital
# effects). ESP32 classic, ESP-IDF. Set the pins to your sender's wiring.

substitutions:
  name: sender-1
  friendly_name: Sender 1
  port1_data: GPIO16      # port 1's data line (pixel frames, markers and Ultra frames to the receiver)
  port1_enable: GPIO25    # its ChannelEnable
  port1_rx: GPIO34        # its RS-485 receiver output (the receiver's answers: page 0x81 and the telemetry)
  port1_de: GPIO4         # its RS-485 driver enable (DE)

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: quinled.diff-power-ultra-digital
    version: "0.1.0"
  areas:
    - id: garden
      name: Garden
  devices:
    - id: port_1
      name: ${friendly_name} · Port 1
    - id: garden_strip
      name: Garden strip
      area_id: garden

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  # @main until the first release; then pin one (@v0.x.y, wiki: Installation)
  - source: github://intermittech/quinled-ultra-esphome@main
    components: [dig2analog_ultra, diffpower, ultra_digital]
    # Developing the component itself? Use the local copy instead:
    # source:
    #   type: local
    #   path: ../components

logger:
api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s   # the strip keeps running without Home Assistant (the default reboots after 15 min)
ota:
  - platform: esphome
    encryption:                # uploads use the api encryption key
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:                 # the fallback hotspot (captive portal) if the Wi-Fi is gone
    password: !secret fallback_ap_password
captive_portal:

uart:
  - id: rs485_1
    rx_pin: ${port1_rx}
    baud_rate: 1000000
    rx_buffer_size: 1024

diffpower:
  - id: port1
    name: Port 1
    device_id: port_1
    enable_pin: ${port1_enable}

dig2analog_ultra:
  - id: line1
    pin: ${port1_data}
    num_boards: 1          # one Ultra-Digital receiver per port
    rmt_symbols: 128
    refresh_interval: 500ms   # a header at least once a second: the receiver's effect clock (the default 200 ms is fine)
    port: port1
    telemetry:
      uart_id: rs485_1
      name: Port 1
      device_id: port_1
      direction_pin: ${port1_de}
      receivers:
        - device_id: garden_strip

light:
  # the local pixel light: the receiver on board 0 of the line, a 300 pixel WS2812B strip
  - platform: ultra_digital
    dig2analog_ultra_id: line1
    name: None
    device_id: garden_strip
    board: 0
    chip: ws2812b
    num_leds: 300
    color_order: GRB
    default_transition_length: 1s
    # what the receiver does without the controller: show the light's last effect again after a power cut
    store_after: 30s
    standalone:
      power_on: true
